name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    name: Frontend CI
    defaults:
      run:
        working-directory: web
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run type-check
      - run: npm run build

  branch-name:
    name: Branch name
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check branch name
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          pattern='^(feat|fix|refactor|task)/[0-9]+-[a-z0-9._-]+$|^(docs|chore)/[a-z0-9._-]+$'
          if ! printf '%s' "$BRANCH" | grep -Eq "$pattern"; then
            echo "::error::브랜치 이름이 규칙에 맞지 않음: $BRANCH (예: feat/98-profile-resume-input, 티켓 없는 유지보수는 chore/bump-deps, 문서는 docs/meeting-notes). CONTRIBUTING.md의 브랜치 항목 참고"
            exit 1
          fi

  all-checks:                 # 보호 규칙이 보는 유일한 검사
    name: all-checks
    if: always()
    needs: [backend, frontend, branch-name]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job failed
        if: |
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled')
        run: exit 1