name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4          # 실제 존재하는 최신 버전으로 확인
      - uses: astral-sh/setup-uv@v6        # 실제 존재하는 최신 버전으로 확인
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  # web/ FE 추가 시 주석 해제 후, 아래 needs에 frontend 추가
  # frontend:
  #   name: Frontend CI
  #   ...

  all-checks:                 # 보호 규칙이 보는 유일한 검사
    name: all-checks
    if: always()
    needs: [backend]          # FE 추가 시 [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1