<!-- 색은 헥사고날 폴더 그림과 같음: 파랑 = 애플리케이션(service) · 초록 = 어댑터 · 회색 = 바깥 · 노랑 글자 = 도메인(JobPosting). 실선 = 호출, 점선 = 돌려받는 값 -->
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1000" viewBox="0 0 960 1000" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Segoe UI', sans-serif" font-size="12.5" role="img" aria-label="MCP 클라이언트가 도구 목록을 받고, get_usage · search_jobs · get_job을 부르면 MCP 서버가 JobService로, JobService가 출처 어댑터로 넘기는 16단계 호출 흐름">
  <defs>
    <marker id="mf-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#59626e"/>
    </marker>
    <style>
      .mono { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
      .lbl { paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; fill: #1f2328; }
      .sub { fill: #68717c; font-size: 11px; }
      .call { stroke: #59626e; stroke-width: 1.6; fill: none; }
      .ret { stroke: #59626e; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; }
      .num circle { fill: #1f2328; }
      .num text { fill: #ffffff; font-size: 11px; font-weight: 700; text-anchor: middle; }
      .dom { fill: #684800; font-weight: 700; }
    </style>
  </defs>
  <rect width="100%" height="100%" rx="10" fill="#ffffff"/>
  <text x="24" y="34" font-size="15" font-weight="700" fill="#1f2328">호출 흐름: 도구 목록을 받고 → 클라이언트가 도구를 부르면 → 서버 · 서비스를 거쳐 출처로</text>
  <text x="24" y="56" font-size="12" fill="#68717c">실선 화살표 = 호출 · 점선 화살표 = 돌려받는 값 · 숫자 = 순서 · 점선 상자 = 이 티켓에서 만들지 않은 부분</text>

  <g id="phases">
    <rect x="16" y="144" width="928" height="24" rx="6" fill="#f5f5f2"/>
    <text x="28" y="161" font-size="13" font-weight="700" fill="#1f2328">1. 연결: 도구 목록 받기</text>
    <rect x="16" y="306" width="928" height="24" rx="6" fill="#f5f5f2"/>
    <text x="28" y="323" font-size="13" font-weight="700" fill="#1f2328">2. 사용법 읽기</text>
    <rect x="16" y="520" width="928" height="24" rx="6" fill="#f5f5f2"/>
    <text x="28" y="537" font-size="13" font-weight="700" fill="#1f2328">3. 검색</text>
    <rect x="16" y="812" width="928" height="24" rx="6" fill="#f5f5f2"/>
    <text x="28" y="829" font-size="13" font-weight="700" fill="#1f2328">4. 본문 가져오기</text>
  </g>

  <g id="lifelines" stroke="#c9ccd1" stroke-width="1.2" stroke-dasharray="4 4">
    <path d="M110 134V986"/>
    <path d="M360 134V986"/>
    <path d="M610 134V986"/>
    <path d="M854 134V986"/>
  </g>

  <g id="lanes">
    <rect x="24" y="76" width="172" height="58" rx="10" fill="#f3f4f6" stroke="#8c95a0" stroke-width="1.4" stroke-dasharray="5 4"/>
    <text x="110" y="99" text-anchor="middle" font-size="14" font-weight="700" fill="#2b2f36">MCP 클라이언트</text>
    <text x="110" y="119" text-anchor="middle" font-size="11.5" fill="#68717c">Claude Code · 테스트의 Client</text>

    <rect x="262" y="76" width="196" height="58" rx="10" fill="#edf7f1" stroke="#58a67e" stroke-width="1.6"/>
    <text x="360" y="99" text-anchor="middle" font-size="14" font-weight="700" fill="#1d6145" class="mono">server.py</text>
    <text x="360" y="119" text-anchor="middle" font-size="11.5" fill="#68717c">adapter/inbound/mcp · FastMCP</text>

    <rect x="508" y="76" width="204" height="58" rx="10" fill="#ecf2ff" stroke="#6d95d6" stroke-width="1.6"/>
    <text x="610" y="99" text-anchor="middle" font-size="14" font-weight="700" fill="#21488a" class="mono">JobService</text>
    <text x="610" y="119" text-anchor="middle" font-size="11.5" fill="#68717c">service/job.py · 도구 세 개</text>

    <rect x="772" y="76" width="164" height="58" rx="10" fill="#edf7f1" stroke="#58a67e" stroke-width="1.4" stroke-dasharray="5 4"/>
    <text x="854" y="99" text-anchor="middle" font-size="14" font-weight="700" fill="#1d6145" class="mono">JobSource</text>
    <text x="854" y="119" text-anchor="middle" font-size="11.5" fill="#68717c">연방고용청 · 가짜 (#11)</text>
  </g>

  <!-- 1. 연결 -->
  <rect x="250" y="178" width="220" height="46" rx="8" fill="#ffffff" stroke="#58a67e" stroke-width="1.2"/>
  <text x="360" y="197" text-anchor="middle" font-size="12" fill="#1f2328">시작할 때 <tspan class="mono">create_server</tspan>가</text>
  <text x="360" y="215" text-anchor="middle" font-size="11.5" fill="#68717c">JobService 메서드 3개를 도구로 등록</text>

  <g class="num"><circle cx="124" cy="252" r="9"/><text x="124" y="256">1</text></g>
  <path class="call" d="M136 252H352" marker-end="url(#mf-arrow)"/>
  <text class="lbl mono" x="244" y="245" text-anchor="middle">tools/list</text>

  <g class="num"><circle cx="346" cy="286" r="9"/><text x="346" y="290">2</text></g>
  <path class="ret" d="M334 286H118" marker-end="url(#mf-arrow)"/>
  <text class="lbl" x="226" y="279" text-anchor="middle">도구 3개 · 설명 · 인자 형식</text>

  <!-- 2. 사용법 읽기 -->
  <g class="num"><circle cx="124" cy="362" r="9"/><text x="124" y="366">3</text></g>
  <path class="call" d="M136 362H352" marker-end="url(#mf-arrow)"/>
  <text class="lbl mono" x="244" y="355" text-anchor="middle">tools/call get_usage</text>

  <g class="num"><circle cx="374" cy="396" r="9"/><text x="374" y="400">4</text></g>
  <path class="call" d="M386 396H602" marker-end="url(#mf-arrow)"/>
  <text class="lbl mono" x="494" y="389" text-anchor="middle">get_usage()</text>

  <g class="num"><circle cx="624" cy="430" r="9"/><text x="624" y="434">5</text></g>
  <path class="call" d="M636 430H846" marker-end="url(#mf-arrow)"/>
  <text class="lbl mono" x="740" y="423" text-anchor="middle">usage()</text>

  <g class="num"><circle cx="840" cy="464" r="9"/><text x="840" y="468">6</text></g>
  <path class="ret" d="M828 464H618" marker-end="url(#mf-arrow)"/>
  <text class="lbl" x="722" y="457" text-anchor="middle">검색 요청 DTO 클래스</text>

  <g class="num"><circle cx="596" cy="498" r="9"/><text x="596" y="502">7</text></g>
  <path class="ret" d="M584 498H118" marker-end="url(#mf-arrow)"/>
  <text class="lbl" x="350" y="491" text-anchor="middle">JSON 스키마 (<tspan class="mono">model_json_schema()</tspan>)</text>

  <!-- 3. 검색 -->
  <g class="num"><circle cx="124" cy="576" r="9"/><text x="124" y="580">8</text></g>
  <path class="call" d="M136 576H352" marker-end="url(#mf-arrow)"/>
  <text class="lbl mono" x="244" y="569" text-anchor="middle">tools/call search_jobs</text>
  <text class="lbl mono sub" x="244" y="593" text-anchor="middle">{"params": {…}}</text>

  <g class="num"><circle cx="374" cy="620" r="9"/><text x="374" y="624">9</text></g>
  <path class="call" d="M386 620H602" marker-end="url(#mf-arrow)"/>
  <text class="lbl mono" x="494" y="613" text-anchor="middle">search_jobs(params)</text>

  <g class="num"><circle cx="624" cy="654" r="9"/><text x="624" y="658">10</text></g>
  <path class="call" d="M636 654H846" marker-end="url(#mf-arrow)"/>
  <text class="lbl" x="740" y="647" text-anchor="middle"><tspan class="mono">search(params)</tspan> 그대로 넘김</text>

  <g class="num"><circle cx="840" cy="688" r="9"/><text x="840" y="692">11</text></g>
  <path class="ret" d="M828 688H618" marker-end="url(#mf-arrow)"/>
  <text class="lbl mono dom" x="722" y="681" text-anchor="middle">list[JobPosting]</text>

  <g class="num"><circle cx="596" cy="722" r="9"/><text x="596" y="726">12</text></g>
  <path class="ret" d="M584 722H118" marker-end="url(#mf-arrow)"/>
  <text class="lbl" x="350" y="715" text-anchor="middle"><tspan class="mono">{"result": [</tspan><tspan class="mono dom">JobPosting</tspan><tspan class="mono">, …]}</tspan></text>

  <rect x="490" y="738" width="240" height="56" rx="8" fill="#ffffff" stroke="#6d95d6" stroke-width="1.2"/>
  <text x="610" y="758" text-anchor="middle" font-size="12" fill="#1f2328">params가 형식에 안 맞으면</text>
  <text x="610" y="776" text-anchor="middle" font-size="11.5" fill="#68717c">"Call get_usage first …"를 붙여</text>
  <text x="610" y="790" text-anchor="middle" font-size="11.5" fill="#68717c">도구 오류로 돌려줌 → LLM이 고침</text>

  <!-- 4. 본문 가져오기 -->
  <g class="num"><circle cx="124" cy="868" r="9"/><text x="124" y="872">13</text></g>
  <path class="call" d="M136 868H352" marker-end="url(#mf-arrow)"/>
  <text class="lbl mono" x="244" y="861" text-anchor="middle">tools/call get_job</text>

  <g class="num"><circle cx="374" cy="902" r="9"/><text x="374" y="906">14</text></g>
  <path class="call" d="M386 902H602" marker-end="url(#mf-arrow)"/>
  <text class="lbl mono" x="494" y="895" text-anchor="middle">get_job(posting_id)</text>

  <g class="num"><circle cx="624" cy="936" r="9"/><text x="624" y="940">15</text></g>
  <path class="call" d="M636 936H846" marker-end="url(#mf-arrow)"/>
  <text class="lbl mono" x="740" y="929" text-anchor="middle">fetch(posting_id)</text>

  <g class="num"><circle cx="840" cy="970" r="9"/><text x="840" y="974">16</text></g>
  <path class="ret" d="M828 970H118" marker-end="url(#mf-arrow)"/>
  <text class="lbl" x="470" y="963" text-anchor="middle"><tspan class="mono dom">JobPosting</tspan> 본문(description)까지 채움</text>
</svg>
