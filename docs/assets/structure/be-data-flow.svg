<!-- 색: 파랑 #2a78d6 = 확정 · 주황 #fab219 = 미정 · 주황 점선(stroke-dasharray) = 추후 · 회색 #c3c2b7 = 선·외부 · 배경 #ededec -->
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="512" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" viewBox="0 0 760 512" role="img" aria-label="두 채널은 SearchQuery와 JobPosting을 같이 쓰고, JMA 앱만 Profile · JD · MatchResult를 더 씀" font-size="13">
  <rect width="100%" height="100%" rx="8" fill="#ffffff"/>
