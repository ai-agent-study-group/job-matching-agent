<!-- 색: 파랑 #2a78d6 = 확정 · 주황 #fab219 = 미정 · 주황 점선(stroke-dasharray) = 추후 · 회색 #c3c2b7 = 선·외부 · 배경 #ededec -->
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="324" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" viewBox="0 0 760 324" role="img" aria-label="1차는 FE와 BE 두 서비스, MCP 엔드포인트는 BE 안에 둠" font-size="13">
  <rect width="100%" height="100%" rx="8" fill="#ffffff"/>
  <defs>
    <marker id="svc-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#c3c2b7"/>
    </marker>
  </defs>
  <text x="24" y="32" font-size="15" font-weight="600" fill="#141413">1차는 FE와 BE 두 서비스, MCP 엔드포인트는 BE 안에 둠</text>
  <g id="legend">
    <rect x="24" y="42" width="16" height="12" rx="3" fill="#2e9e6a" fill-opacity="0.12" stroke="#2e9e6a" stroke-width="1.5"/>
    <text x="48" y="52" font-size="11.5" fill="#52514e">FE (화면)</text>
    <rect x="112" y="42" width="16" height="12" rx="3" fill="none" stroke="#52514e" stroke-width="1.5"/>
    <text x="136" y="52" font-size="11.5" fill="#52514e">BE</text>
    <rect x="168" y="42" width="16" height="12" rx="3" fill="none" stroke="#c3c2b7" stroke-width="1.25" stroke-dasharray="4 3"/>
    <text x="192" y="52" font-size="11.5" fill="#52514e">조건부</text>
    <rect x="240" y="42" width="16" height="12" rx="3" fill="none" stroke="#c3c2b7" stroke-width="1.25"/>
    <text x="264" y="52" font-size="11.5" fill="#52514e">외부</text>
  </g>
  <g id="band-services">
    <rect x="24" y="68" width="496" height="112" rx="8" fill="#ededec" stroke="none"/>
    <text x="40" y="90" font-weight="600" fill="#141413">서비스 (우리 코드)</text>
  </g>
  <g id="band-db">
    <rect x="24" y="204" width="496" height="96" rx="8" fill="#ededec" stroke="none"/>
    <text x="40" y="226" font-weight="600" fill="#141413">DB</text>
    <text x="40" y="246" font-size="11.5" fill="#52514e">Redis 큐는 추후 (BE-2)</text>
  </g>
  <g id="connectors" fill="none" stroke="#c3c2b7" stroke-width="1.25">
    <path d="M208 136H328" marker-end="url(#svc-arrow)"/>
    <path d="M556 136H488" marker-end="url(#svc-arrow)"/>
    <path d="M408 162V226" stroke-dasharray="5 4" marker-end="url(#svc-arrow)"/>
  </g>
  <text x="268" y="128" text-anchor="middle" font-size="11.5" fill="#52514e">HTTP</text>
  <text x="522" y="128" text-anchor="middle" font-size="11.5" fill="#52514e">HTTPS</text>
  <text x="416" y="198" font-size="11.5" fill="#52514e">저장할 때만</text>
  <g id="fe">
    <rect x="48" y="110" width="160" height="52" rx="8" fill="#2e9e6a" fill-opacity="0.1" stroke="#2e9e6a" stroke-width="1.75"/>
    <text x="128" y="132" text-anchor="middle" font-weight="600" fill="#141413">FE</text>
    <text x="128" y="150" text-anchor="middle" font-size="11.5" fill="#52514e">프레임워크 미정</text>
  </g>
  <g id="be">
    <rect x="328" y="110" width="160" height="52" rx="8" fill="none" stroke="#52514e" stroke-width="1.5"/>
    <text x="408" y="132" text-anchor="middle" font-weight="600" fill="#141413">BE</text>
    <text x="408" y="150" text-anchor="middle" font-size="11.5" fill="#52514e">API + MCP 엔드포인트</text>
  </g>
  <g id="connector-clients">
    <rect x="556" y="110" width="180" height="52" rx="8" fill="none" stroke="#c3c2b7" stroke-width="1.25"/>
    <text x="646" y="132" text-anchor="middle" font-weight="600" fill="#141413">MCP 커넥터</text>
    <text x="646" y="150" text-anchor="middle" font-size="11.5" fill="#52514e">사용자의 AI 앱</text>
  </g>
  <g id="main-db">
    <rect x="318" y="226" width="180" height="52" rx="8" fill="none" stroke="#c3c2b7" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="408" y="248" text-anchor="middle" font-weight="600" fill="#141413">메인 DB (조건부)</text>
    <text x="408" y="266" text-anchor="middle" font-size="11.5" fill="#52514e">DevOps-6에서 저장하기로 하면</text>
  </g>
</svg>
