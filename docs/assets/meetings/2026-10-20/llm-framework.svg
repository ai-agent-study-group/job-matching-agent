<!-- 색: 파랑 #2a78d6 = 확정 · 주황 #fab219 = 미정 · 주황 점선(stroke-dasharray) = 추후 · 회색 #c3c2b7 = 선·외부 · 배경 #ededec -->
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="512" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" viewBox="0 0 760 512" role="img" aria-label="pydantic-ai는 흐름을 우리 코드에 두고, LangGraph는 흐름까지 그래프로 맡음" font-size="13">
  <rect width="100%" height="100%" rx="8" fill="#ffffff"/>
  <defs>
    <marker id="fw-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#c3c2b7"/>
    </marker>
  </defs>
  <text x="24" y="32" font-size="15" font-weight="600" fill="#141413">pydantic-ai는 흐름을 우리 코드에 두고, LangGraph는 흐름까지 그래프로 맡음</text>
  <g id="legend">
    <rect x="24" y="46" width="16" height="12" rx="3" fill="#fab219" fill-opacity="0.12" stroke="#fab219" stroke-width="1.5"/>
    <text x="48" y="56" font-size="11.5" fill="#52514e">agent (LLM 호출)</text>
    <rect x="176" y="46" width="16" height="12" rx="3" fill="#ededec"/>
    <text x="200" y="56" font-size="11.5" fill="#52514e">코드 단계</text>
    <path d="M290 52H314" fill="none" stroke="#c3c2b7" stroke-width="1.25" stroke-dasharray="4 3"/>
    <text x="322" y="56" font-size="11.5" fill="#52514e">조건부 엣지 (되돌아가기)</text>
  </g>
  <g id="pydantic-side">
    <rect x="24" y="72" width="344" height="322" rx="8" fill="none" stroke="#e6e6e6" stroke-width="1.25"/>
    <text x="40" y="94" font-weight="600" fill="#141413">pydantic-ai</text>
    <text x="40" y="112" font-size="11.5" fill="#52514e">흐름 = run_matching() 코드</text>
  </g>
  <g id="pydantic-steps">
    <rect x="96" y="128" width="200" height="30" rx="8" fill="#fab219" fill-opacity="0.12" stroke="#fab219" stroke-width="1.5"/>
    <text x="196" y="147" text-anchor="middle" fill="#141413">프로필 agent</text>
    <rect x="96" y="172" width="200" height="30" rx="8" fill="#ededec" fill-opacity="1" stroke="none" stroke-width="1.5"/>
    <text x="196" y="191" text-anchor="middle" fill="#141413">검색 · 거르기</text>
    <rect x="96" y="216" width="200" height="30" rx="8" fill="#fab219" fill-opacity="0.12" stroke="#fab219" stroke-width="1.5"/>
    <text x="196" y="235" text-anchor="middle" fill="#141413">공고 정리 agent ×N</text>
    <rect x="96" y="260" width="200" height="30" rx="8" fill="#ededec" fill-opacity="1" stroke="none" stroke-width="1.5"/>
    <text x="196" y="279" text-anchor="middle" fill="#141413">조건 필터</text>
    <rect x="96" y="304" width="200" height="30" rx="8" fill="#fab219" fill-opacity="0.12" stroke="#fab219" stroke-width="1.5"/>
    <text x="196" y="323" text-anchor="middle" fill="#141413">매칭 agent ×N</text>
    <rect x="96" y="348" width="200" height="30" rx="8" fill="#ededec" fill-opacity="1" stroke="none" stroke-width="1.5"/>
    <text x="196" y="367" text-anchor="middle" fill="#141413">점수 · 정렬</text>
  </g>
  <g id="langgraph-side">
    <rect x="392" y="72" width="344" height="322" rx="8" fill="none" stroke="#e6e6e6" stroke-width="1.25"/>
    <text x="408" y="94" font-weight="600" fill="#141413">LangGraph</text>
    <text x="408" y="112" font-size="11.5" fill="#52514e">흐름 = StateGraph (노드 · 엣지)</text>
  </g>
  <g id="langgraph-nodes">
    <rect x="448" y="128" width="200" height="30" rx="15" fill="#fab219" fill-opacity="0.12" stroke="#fab219" stroke-width="1.5"/>
    <text x="548" y="147" text-anchor="middle" fill="#141413">프로필 agent</text>
    <rect x="448" y="172" width="200" height="30" rx="15" fill="#ededec" fill-opacity="1" stroke="none" stroke-width="1.5"/>
    <text x="548" y="191" text-anchor="middle" fill="#141413">검색 · 거르기</text>
    <rect x="448" y="216" width="200" height="30" rx="15" fill="#fab219" fill-opacity="0.12" stroke="#fab219" stroke-width="1.5"/>
    <text x="548" y="235" text-anchor="middle" fill="#141413">공고 정리 agent ×N</text>
    <rect x="448" y="260" width="200" height="30" rx="15" fill="#ededec" fill-opacity="1" stroke="none" stroke-width="1.5"/>
    <text x="548" y="279" text-anchor="middle" fill="#141413">조건 필터</text>
    <rect x="448" y="304" width="200" height="30" rx="15" fill="#fab219" fill-opacity="0.12" stroke="#fab219" stroke-width="1.5"/>
    <text x="548" y="323" text-anchor="middle" fill="#141413">매칭 agent ×N</text>
    <rect x="448" y="348" width="200" height="30" rx="15" fill="#ededec" fill-opacity="1" stroke="none" stroke-width="1.5"/>
    <text x="548" y="367" text-anchor="middle" fill="#141413">점수 · 정렬</text>
  </g>
  <g id="state">
    <rect x="664" y="128" width="56" height="250" rx="8" fill="none" stroke="#c3c2b7" stroke-width="1.25"/>
    <text x="692" y="150" text-anchor="middle" font-size="11.5" font-weight="600" fill="#141413">상태</text>
    <text x="692" y="168" text-anchor="middle" font-size="10.5" fill="#52514e">체크포인트</text>
    <text x="692" y="190" text-anchor="middle" font-size="10.5" fill="#52514e">단계마다</text>
    <text x="692" y="204" text-anchor="middle" font-size="10.5" fill="#52514e">저장</text>
  </g>
  <g id="connectors" fill="none" stroke="#c3c2b7" stroke-width="1.25">
    <path d="M196 158V172" marker-end="url(#fw-arrow)"/>
    <path d="M196 202V216" marker-end="url(#fw-arrow)"/>
    <path d="M196 246V260" marker-end="url(#fw-arrow)"/>
    <path d="M196 290V304" marker-end="url(#fw-arrow)"/>
    <path d="M196 334V348" marker-end="url(#fw-arrow)"/>
    <path d="M548 158V172" marker-end="url(#fw-arrow)"/>
    <path d="M548 202V216" marker-end="url(#fw-arrow)"/>
    <path d="M548 246V260" marker-end="url(#fw-arrow)"/>
    <path d="M548 290V304" marker-end="url(#fw-arrow)"/>
    <path d="M548 334V348" marker-end="url(#fw-arrow)"/>
    <path d="M448 275H428V187H448" stroke-dasharray="4 3" marker-end="url(#fw-arrow)"/>
  </g>
  <g id="state-links" fill="none" stroke="#e6e6e6" stroke-width="1.25">
    <path d="M648 143H664"/>
    <path d="M648 187H664"/>
    <path d="M648 231H664"/>
    <path d="M648 275H664"/>
    <path d="M648 319H664"/>
    <path d="M648 363H664"/>
  </g>
  <g id="pydantic-notes">
    <text x="24" y="422" font-size="11.5" fill="#141413">순서: 코드에 적은 순서대로 실행</text>
    <text x="24" y="440" font-size="11.5" fill="#141413">공고별 병렬: asyncio.gather로 직접 작성</text>
    <text x="24" y="458" font-size="11.5" fill="#141413">분기 · 반복: if · while로 직접 작성</text>
    <text x="24" y="476" font-size="11.5" fill="#141413">멈추면: 처음부터 다시 실행</text>
    <text x="24" y="494" font-size="11.5" fill="#52514e">재개하려면 Temporal · DBOS 연동</text>
  </g>
  <g id="langgraph-notes">
    <text x="392" y="422" font-size="11.5" fill="#141413">순서: 노드와 엣지로 선언, LangGraph가 실행</text>
    <text x="392" y="440" font-size="11.5" fill="#141413">공고별 병렬: Send로 노드를 공고마다 분기</text>
    <text x="392" y="458" font-size="11.5" fill="#141413">분기 · 반복: 조건부 엣지로 선언 (점선)</text>
    <text x="392" y="476" font-size="11.5" fill="#141413">멈추면: 체크포인트에서 이어서 실행</text>
  </g>
</svg>
