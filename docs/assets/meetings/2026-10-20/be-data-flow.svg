<!-- 색: 파랑 #2a78d6 = 확정 · 주황 #fab219 = 미정 · 주황 점선(stroke-dasharray) = 추후 · 회색 #c3c2b7 = 선·외부 · 배경 #ededec -->
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="448" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" viewBox="0 0 760 448" role="img" aria-label="공고는 공개 API로 받고, 이력서와 결과는 저장소에 올리지 않음" font-size="13">
  <rect width="100%" height="100%" rx="8" fill="#ffffff"/>
  <defs>
    <marker id="data-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#c3c2b7"/>
    </marker>
  </defs>
  <text x="24" y="32" font-size="15" font-weight="600" fill="#141413">공고는 공개 API로 받고, 이력서와 결과는 저장소에 올리지 않음</text>
  <g id="legend">
    <rect x="24" y="44" width="16" height="12" rx="3" fill="#2a78d6" fill-opacity="0.1" stroke="#2a78d6" stroke-width="1.5"/>
    <text x="48" y="54" font-size="11.5" fill="#52514e">확정 (PoC)</text>
    <rect x="124" y="44" width="16" height="12" rx="3" fill="#fab219" fill-opacity="0.1" stroke="#fab219" stroke-width="1.5"/>
    <text x="148" y="54" font-size="11.5" fill="#52514e">미정 (회의에서 정함)</text>
    <rect x="284" y="44" width="16" height="12" rx="3" fill="none" stroke="#fab219" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="308" y="54" font-size="11.5" fill="#52514e">추후</text>
    <rect x="356" y="44" width="16" height="12" rx="3" fill="none" stroke="#c3c2b7" stroke-width="1.25"/>
    <text x="380" y="54" font-size="11.5" fill="#52514e">외부 서비스</text>
  </g>
  <g id="connectors" fill="none" stroke="#c3c2b7" stroke-width="1.25">
    <path d="M136 192V212H376"/>
    <path d="M616 192V212H376" stroke-dasharray="5 4"/>
    <path d="M376 192V240" marker-end="url(#data-arrow)"/>
    <path d="M220 276H268" marker-end="url(#data-arrow)"/>
    <path d="M484 276H532" marker-end="url(#data-arrow)"/>
    <path d="M376 312V352" marker-end="url(#data-arrow)"/>
    <path d="M484 388H532" stroke-dasharray="5 4" marker-end="url(#data-arrow)"/>
    <path d="M104 312V352" stroke-dasharray="5 4" marker-end="url(#data-arrow)"/>
    <path d="M140 352V312" stroke-dasharray="5 4" marker-end="url(#data-arrow)"/>
  </g>
  <text x="384" y="232" font-size="11.5" fill="#52514e">공고</text>
  <text x="508" y="380" text-anchor="middle" font-size="11.5" fill="#52514e">비교</text>
  <g id="src-poc">
    <rect x="24" y="72" width="224" height="120" rx="8" fill="#2a78d6" fill-opacity="0.1" stroke="#2a78d6" stroke-width="1.75"/>
    <text x="40" y="96" font-weight="600" fill="#141413">PoC: 공개 API 2곳</text>
    <text x="40" y="112" font-size="11.5" fill="#52514e">Greenhouse (회사별)</text>
    <text x="40" y="128" font-size="11.5" fill="#52514e">연방고용청 (여러 회사)</text>
  </g>
  <g id="src-api">
    <rect x="264" y="72" width="224" height="120" rx="8" fill="#fab219" fill-opacity="0.1" stroke="#fab219" stroke-width="1.75"/>
    <text x="280" y="96" font-weight="600" fill="#141413">다른 공개 API</text>
    <text x="280" y="112" font-size="11.5" fill="#52514e">ATS: Lever · Ashby</text>
    <text x="280" y="128" font-size="11.5" fill="#52514e">SmartRecruiters · Workable</text>
    <text x="280" y="144" font-size="11.5" fill="#52514e">Personio · Recruitee</text>
    <text x="280" y="160" font-size="11.5" fill="#52514e">여러 회사: Arbeitnow · Adzuna</text>
    <text x="280" y="176" font-size="11.5" fill="#52514e">Jooble · Remotive</text>
  </g>
  <g id="src-big">
    <rect x="504" y="72" width="224" height="120" rx="8" fill="#fab219" fill-opacity="0.04" stroke="#fab219" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="520" y="96" font-weight="600" fill="#141413">추후: 대형 사이트</text>
    <text x="520" y="112" font-size="11.5" fill="#52514e">LinkedIn · Indeed · XING</text>
    <text x="520" y="128" font-size="11.5" fill="#52514e">알림 메일·스크랩으로 공고 찾기</text>
    <text x="520" y="144" font-size="11.5" fill="#52514e">본문은 회사 채용 페이지에서</text>
  </g>
  <g id="resume">
    <rect x="24" y="240" width="196" height="72" rx="8" fill="#fab219" fill-opacity="0.1" stroke="#fab219" stroke-width="1.75"/>
    <text x="40" y="264" font-weight="600" fill="#141413">이력서</text>
    <text x="40" y="280" font-size="11.5" fill="#52514e">PoC: poc/private/</text>
    <text x="40" y="296" font-size="11.5" fill="#52514e">서비스: 보관·삭제 방식</text>
  </g>
  <g id="agent">
    <rect x="268" y="240" width="216" height="72" rx="8" fill="#2a78d6" fill-opacity="0.1" stroke="#2a78d6" stroke-width="1.75"/>
    <text x="284" y="264" font-weight="600" fill="#141413">agent</text>
    <text x="284" y="280" font-size="11.5" fill="#52514e">프로필 · 검색 · 매칭</text>
    <text x="284" y="296" font-size="11.5" fill="#52514e">MCP 도구로 공고를 읽음</text>
  </g>
  <g id="llm">
    <rect x="532" y="240" width="196" height="72" rx="8" fill="none" stroke="#c3c2b7" stroke-width="1.25"/>
    <text x="548" y="264" font-weight="600" fill="#141413">LLM 제공사</text>
    <text x="548" y="280" font-size="11.5" fill="#52514e">이력서와 공고 본문이 전송됨</text>
  </g>
  <g id="result">
    <rect x="268" y="352" width="216" height="72" rx="8" fill="#2a78d6" fill-opacity="0.1" stroke="#2a78d6" stroke-width="1.75"/>
    <text x="284" y="376" font-weight="600" fill="#141413">매칭 결과</text>
    <text x="284" y="392" font-size="11.5" fill="#52514e">PoC: poc/private/output/</text>
    <text x="284" y="408" font-size="11.5" fill="#52514e">서비스: 메인 DB (DevOps)</text>
  </g>
  <g id="eval">
    <rect x="532" y="352" width="196" height="72" rx="8" fill="#fab219" fill-opacity="0.04" stroke="#fab219" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="548" y="376" font-weight="600" fill="#141413">평가 셋 (eval/)</text>
    <text x="548" y="392" font-size="11.5" fill="#52514e">공고 약 30개 + 정답 라벨</text>
    <text x="548" y="408" font-size="11.5" fill="#52514e">기준 이력서 · 본문 보관</text>
  </g>
  <text x="96" y="336" text-anchor="end" font-size="11.5" fill="#52514e">질문</text>
  <text x="148" y="336" font-size="11.5" fill="#52514e">보완</text>
  <g id="chat">
    <rect x="24" y="352" width="196" height="72" rx="8" fill="#fab219" fill-opacity="0.04" stroke="#fab219" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="40" y="376" font-weight="600" fill="#141413">추후: chat</text>
    <text x="40" y="392" font-size="11.5" fill="#52514e">질문과 답으로</text>
    <text x="40" y="408" font-size="11.5" fill="#52514e">이력서 세부 정보 보완</text>
  </g>
</svg>
