<!-- 색: 파랑 #2a78d6 = 확정 · 주황 #fab219 = 미정 · 주황 점선(stroke-dasharray) = 추후 · 회색 #c3c2b7 = 선·외부 · 배경 #ededec -->
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="334" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" viewBox="0 0 760 334" role="img" aria-label="PoC는 FE, API, 메인 DB만 쓰고 worker와 Redis는 추후" font-size="13">
  <rect width="100%" height="100%" rx="8" fill="#ffffff"/>
  <defs>
    <marker id="infra-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#c3c2b7"/>
    </marker>
  </defs>
  <text x="24" y="32" font-size="15" font-weight="600" fill="#141413">PoC는 FE · API · 메인 DB만, worker와 Redis는 추후</text>
  <g id="legend">
    <rect x="24" y="42" width="16" height="12" rx="3" fill="#2a78d6" fill-opacity="0.1" stroke="#2a78d6" stroke-width="1.5"/>
    <text x="48" y="52" font-size="11.5" fill="#52514e">확정</text>
    <rect x="96" y="42" width="16" height="12" rx="3" fill="#fab219" fill-opacity="0.1" stroke="#fab219" stroke-width="1.5"/>
    <text x="120" y="52" font-size="11.5" fill="#52514e">미정 (회의에서 정함)</text>
    <rect x="270" y="42" width="16" height="12" rx="3" fill="none" stroke="#fab219" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="294" y="52" font-size="11.5" fill="#52514e">추후 (worker 방식으로 넘어갈 때)</text>
  </g>
  <g id="band-services">
    <rect x="24" y="68" width="712" height="112" rx="8" fill="#ededec" stroke="none"/>
    <text x="40" y="90" font-weight="600" fill="#141413">서비스 (우리 코드) · 따로 돌릴지 정함</text>
  </g>
  <g id="band-db">
    <rect x="24" y="204" width="712" height="120" rx="8" fill="#ededec" stroke="none"/>
    <text x="40" y="226" font-weight="600" fill="#141413">DB (저장소)</text>
  </g>
  <g id="connectors" fill="none" stroke="#c3c2b7" stroke-width="1.25">
    <path d="M210 136H300" marker-end="url(#infra-arrow)"/>
    <path d="M340 162V242" marker-end="url(#infra-arrow)"/>
    <path d="M420 162V190H480V242" stroke-dasharray="5 4" marker-end="url(#infra-arrow)"/>
    <path d="M630 162V190H580V242" stroke-dasharray="5 4" marker-start="url(#infra-arrow)"/>
    <path d="M690 162V308H255V294" stroke-dasharray="5 4" marker-end="url(#infra-arrow)"/>
  </g>
  <text x="255" y="128" text-anchor="middle" font-size="11.5" fill="#52514e">HTTP</text>
  <text x="474" y="220" text-anchor="end" font-size="11.5" fill="#52514e">작업 넣기</text>
  <text x="588" y="220" font-size="11.5" fill="#52514e">작업 꺼내기</text>
  <text x="682" y="260" text-anchor="end" font-size="11.5" fill="#52514e">결과 저장</text>
  <g id="fe">
    <rect x="50" y="110" width="160" height="52" rx="8" fill="#fab219" fill-opacity="0.1" stroke="#fab219" stroke-width="1.75"/>
    <text x="130" y="132" text-anchor="middle" font-weight="600" fill="#141413">FE</text>
    <text x="130" y="150" text-anchor="middle" font-size="11.5" fill="#52514e">프레임워크 미정</text>
  </g>
  <g id="api">
    <rect x="300" y="110" width="160" height="52" rx="8" fill="#2a78d6" fill-opacity="0.1" stroke="#2a78d6" stroke-width="1.75"/>
    <text x="380" y="132" text-anchor="middle" font-weight="600" fill="#141413">BE (API)</text>
    <text x="380" y="150" text-anchor="middle" font-size="11.5" fill="#52514e">PoC: 파이프라인도 실행</text>
  </g>
  <g id="worker">
    <rect x="550" y="110" width="160" height="52" rx="8" fill="#fab219" fill-opacity="0.04" stroke="#fab219" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="630" y="132" text-anchor="middle" font-weight="600" fill="#141413">worker (추후)</text>
    <text x="630" y="150" text-anchor="middle" font-size="11.5" fill="#52514e">파이프라인 실행</text>
  </g>
  <g id="main-db">
    <rect x="155" y="242" width="200" height="52" rx="8" fill="#fab219" fill-opacity="0.1" stroke="#fab219" stroke-width="1.75"/>
    <text x="255" y="264" text-anchor="middle" font-weight="600" fill="#141413">메인 DB</text>
    <text x="255" y="282" text-anchor="middle" font-size="11.5" fill="#52514e">후보: MongoDB · PostgreSQL</text>
  </g>
  <g id="redis">
    <rect x="440" y="242" width="180" height="52" rx="8" fill="#fab219" fill-opacity="0.04" stroke="#fab219" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="530" y="264" text-anchor="middle" font-weight="600" fill="#141413">Redis (추후)</text>
    <text x="530" y="282" text-anchor="middle" font-size="11.5" fill="#52514e">작업 큐</text>
  </g>
</svg>
