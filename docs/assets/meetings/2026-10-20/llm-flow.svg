<!-- 색: 파랑 #2a78d6 = 확정 · 주황 #fab219 = 미정 · 주황 점선(stroke-dasharray) = 추후 · 회색 #c3c2b7 = 선·외부 · 배경 #ededec -->
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="644" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" viewBox="0 0 760 644" role="img" aria-label="판단이 필요한 곳만 agent, 나머지 연결은 코드가 함" font-size="13">
  <rect width="100%" height="100%" rx="8" fill="#ffffff"/>
  <defs>
    <marker id="fn-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#c3c2b7"/>
    </marker>
  </defs>
  <text x="24" y="32" font-size="15" font-weight="600" fill="#141413">판단이 필요한 곳만 agent, 나머지 연결은 코드가 함</text>
  <g id="legend">
    <rect x="24" y="44" width="16" height="12" rx="3" fill="#fab219" fill-opacity="0.12" stroke="#fab219" stroke-width="1.5"/>
    <text x="48" y="54" font-size="11.5" fill="#52514e">LLM 단계 (agent)</text>
    <rect x="160" y="44" width="16" height="12" rx="3" fill="#ededec" stroke="none"/>
    <text x="184" y="54" font-size="11.5" fill="#52514e">코드</text>
    <rect x="232" y="44" width="16" height="12" rx="3" fill="none" stroke="#fab219" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="256" y="54" font-size="11.5" fill="#52514e">추후</text>
    <rect x="304" y="44" width="16" height="12" rx="3" fill="none" stroke="#c3c2b7" stroke-width="1.25"/>
    <text x="328" y="54" font-size="11.5" fill="#52514e">외부 · 데이터</text>
  </g>
  <g id="connectors" fill="none" stroke="#c3c2b7" stroke-width="1.25">
    <path d="M380 116V134" marker-end="url(#fn-arrow)"/>
    <path d="M380 184V202" marker-end="url(#fn-arrow)"/>
    <path d="M380 244V262" marker-end="url(#fn-arrow)"/>
    <path d="M380 304V322" marker-end="url(#fn-arrow)"/>
    <path d="M380 372V390" marker-end="url(#fn-arrow)"/>
    <path d="M380 432V450" marker-end="url(#fn-arrow)"/>
    <path d="M380 500V518" marker-end="url(#fn-arrow)"/>
    <path d="M380 560V578" marker-end="url(#fn-arrow)"/>
    <path d="M200 96H246" marker-end="url(#fn-arrow)"/>
    <path d="M200 160H246" stroke-dasharray="5 4" marker-end="url(#fn-arrow)"/>
    <path d="M200 224H246" stroke-dasharray="5 4" marker-end="url(#fn-arrow)"/>
    <path d="M248 600H202" marker-end="url(#fn-arrow)"/>
    <path d="M648 184V214H514" marker-end="url(#fn-arrow)"/>
    <path d="M512 240H558" marker-end="url(#fn-arrow)"/>
    <path d="M512 284H558" marker-end="url(#fn-arrow)"/>
    <path d="M512 540H558" stroke-dasharray="5 4" marker-end="url(#fn-arrow)"/>
  </g>
  <text x="535" y="233" text-anchor="middle" font-size="11.5" fill="#52514e">검색</text>
  <text x="535" y="277" text-anchor="middle" font-size="11.5" fill="#52514e">본문</text>
  <g id="step-text">
    <rect x="248" y="76" width="264" height="40" rx="8" fill="#ededec" stroke="none"/>
    <text x="380" y="92" text-anchor="middle" font-weight="600" fill="#141413">이력서 → 텍스트</text>
    <text x="380" y="108" text-anchor="middle" font-size="11.5" fill="#52514e">PDF · Word 변환</text>
  </g>
  <g id="step-profile">
    <rect x="248" y="136" width="264" height="48" rx="8" fill="#fab219" fill-opacity="0.12" stroke="#fab219" stroke-width="1.75"/>
    <text x="380" y="156" text-anchor="middle" font-weight="600" fill="#141413">프로필 agent</text>
    <text x="380" y="174" text-anchor="middle" font-size="11.5" fill="#52514e">이력서 구조화 · 검색어(직무명)</text>
  </g>
  <g id="step-search">
    <rect x="248" y="204" width="264" height="40" rx="8" fill="#ededec" stroke="none"/>
    <text x="380" y="220" text-anchor="middle" font-weight="600" fill="#141413">출처 선택 · 검색 · 중복 제거</text>
    <text x="380" y="236" text-anchor="middle" font-size="11.5" fill="#52514e">회사 목록 + 여러 회사 API 전부</text>
  </g>
  <g id="step-prefilter">
    <rect x="248" y="264" width="264" height="40" rx="8" fill="#ededec" stroke="none"/>
    <text x="380" y="280" text-anchor="middle" font-weight="600" fill="#141413">1차 거르기 · 본문 가져오기</text>
    <text x="380" y="296" text-anchor="middle" font-size="11.5" fill="#52514e">제목·지역 규칙 · 상세 조회</text>
  </g>
  <g id="step-structure">
    <rect x="248" y="324" width="264" height="48" rx="8" fill="#fab219" fill-opacity="0.12" stroke="#fab219" stroke-width="1.75"/>
    <text x="380" y="344" text-anchor="middle" font-weight="600" fill="#141413">공고 정리 agent</text>
    <text x="380" y="362" text-anchor="middle" font-size="11.5" fill="#52514e">요건 · 언어 · 연차 추출 · 공고마다</text>
    <text x="500" y="352" text-anchor="end" font-weight="600" fill="#141413">×N</text>
  </g>
  <g id="step-filter">
    <rect x="248" y="392" width="264" height="40" rx="8" fill="#ededec" stroke="none"/>
    <text x="380" y="408" text-anchor="middle" font-weight="600" fill="#141413">조건 필터</text>
    <text x="380" y="424" text-anchor="middle" font-size="11.5" fill="#52514e">언어 필수 · 지역 · 연차를 프로필과 비교</text>
  </g>
  <g id="step-match">
    <rect x="248" y="452" width="264" height="48" rx="8" fill="#fab219" fill-opacity="0.12" stroke="#fab219" stroke-width="1.75"/>
    <text x="380" y="472" text-anchor="middle" font-weight="600" fill="#141413">매칭 agent</text>
    <text x="380" y="490" text-anchor="middle" font-size="11.5" fill="#52514e">요건별 충족 판정 · 근거 · 공고마다</text>
    <text x="500" y="480" text-anchor="end" font-weight="600" fill="#141413">×N</text>
  </g>
  <g id="step-rank">
    <rect x="248" y="520" width="264" height="40" rx="8" fill="#ededec" stroke="none"/>
    <text x="380" y="536" text-anchor="middle" font-weight="600" fill="#141413">점수 · 정렬 · 상위 N개</text>
    <text x="380" y="552" text-anchor="middle" font-size="11.5" fill="#52514e">점수: 규칙 합산 또는 LLM (2번)</text>
  </g>
  <g id="step-result">
    <rect x="248" y="580" width="264" height="40" rx="8" fill="#ededec" stroke="none"/>
    <text x="380" y="596" text-anchor="middle" font-weight="600" fill="#141413">결과 저장 · 화면</text>
    <text x="380" y="612" text-anchor="middle" font-size="11.5" fill="#52514e">DB · FE</text>
  </g>
  <g id="in-resume">
    <rect x="24" y="76" width="176" height="40" rx="8" fill="none" stroke="#c3c2b7" stroke-width="1.25"/>
    <text x="112" y="100" text-anchor="middle" fill="#141413">이력서 파일</text>
  </g>
  <g id="in-chat">
    <rect x="24" y="136" width="176" height="48" rx="8" fill="#fab219" fill-opacity="0.04" stroke="#fab219" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="112" y="156" text-anchor="middle" font-weight="600" fill="#141413">대화 agent (추후)</text>
    <text x="112" y="174" text-anchor="middle" font-size="11.5" fill="#52514e">빠진 정보를 묻고 반영</text>
  </g>
  <g id="in-alert">
    <rect x="24" y="200" width="176" height="48" rx="8" fill="#fab219" fill-opacity="0.04" stroke="#fab219" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="112" y="220" text-anchor="middle" font-weight="600" fill="#141413">알림 추출 agent (추후)</text>
    <text x="112" y="238" text-anchor="middle" font-size="11.5" fill="#52514e">알림 메일 → 회사 · 직무 · 링크</text>
  </g>
  <g id="out-user">
    <rect x="24" y="580" width="176" height="40" rx="8" fill="none" stroke="#c3c2b7" stroke-width="1.25"/>
    <text x="112" y="604" text-anchor="middle" fill="#141413">사용자 (화면)</text>
  </g>
  <g id="data-companies">
    <rect x="560" y="136" width="176" height="48" rx="8" fill="none" stroke="#c3c2b7" stroke-width="1.25"/>
    <text x="648" y="156" text-anchor="middle" font-weight="600" fill="#141413">사이트 · 회사 목록</text>
    <text x="648" y="174" text-anchor="middle" font-size="11.5" fill="#52514e">회사 → ATS 대응표</text>
  </g>
  <g id="ext-sites">
    <rect x="560" y="234" width="176" height="70" rx="8" fill="none" stroke="#c3c2b7" stroke-width="1.25"/>
    <text x="648" y="273" text-anchor="middle" fill="#141413">공고 사이트</text>
  </g>
  <g id="eval">
    <rect x="560" y="520" width="176" height="40" rx="8" fill="none" stroke="#fab219" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="648" y="536" text-anchor="middle" font-weight="600" fill="#141413">평가 셋 비교 (추후)</text>
    <text x="648" y="552" text-anchor="middle" font-size="11.5" fill="#52514e">정답 라벨과 비교</text>
  </g>
