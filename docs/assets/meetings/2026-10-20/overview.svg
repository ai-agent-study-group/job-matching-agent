    <rect x="290" y="46" width="16" height="12" rx="3" fill="none" stroke="#fab219" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="314" y="56" font-size="11.5" fill="#52514e">추후 (PoC 이후)</text>
    <rect x="430" y="46" width="16" height="12" rx="3" fill="none" stroke="#c3c2b7" stroke-width="1.25"/>
