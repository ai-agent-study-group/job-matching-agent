<!-- 색: 파랑 #2a78d6 = 확정 · 주황 #fab219 = 미정 · 주황 점선(stroke-dasharray) = 추후 · 회색 #c3c2b7 = 선·외부 · 배경 #ededec -->
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="376" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" viewBox="0 0 760 376" role="img" aria-label="web에 어느 층까지 둘지 A, B, C 중 회의에서 정함" font-size="13">
  <rect width="100%" height="100%" rx="8" fill="#ffffff"/>
  <defs>
    <marker id="fe-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#c3c2b7"/>
    </marker>
  </defs>
  <text x="24" y="32" font-size="15" font-weight="600" fill="#141413">PoC는 화면만(A), 프록시·BFF(B)와 로직·LLM(C)은 추후</text>
  <g id="web">
    <rect x="40" y="52" width="520" height="200" rx="8" fill="none" stroke="#e6e6e6" stroke-width="1.25"/>
    <text x="56" y="76" font-weight="600" fill="#141413">web (FE 프로젝트)</text>
  </g>
  <g id="layer-ui">
    <rect x="60" y="90" width="480" height="44" rx="8" fill="#2a78d6" fill-opacity="0.1" stroke="#2a78d6" stroke-width="1.75"/>
    <text x="300" y="116" text-anchor="middle" font-weight="600" fill="#141413">화면 (UI)</text>
  </g>
  <g id="layer-relay">
    <rect x="60" y="142" width="480" height="44" rx="8" fill="#fab219" fill-opacity="0.04" stroke="#fab219" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="300" y="168" text-anchor="middle" fill="#141413">프록시·BFF: 세션 확인 · 요청 전달 · SSR 조회</text>
  </g>
  <g id="layer-logic">
    <rect x="60" y="194" width="480" height="44" rx="8" fill="#fab219" fill-opacity="0.04" stroke="#fab219" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="300" y="220" text-anchor="middle" fill="#141413">업무 로직 · LLM 호출 · DB 접근</text>
  </g>
  <g id="brackets" fill="none" stroke="#141413" stroke-width="1.5">
    <path d="M574 92H582V132H574"/>
    <path d="M618 92H626V184H618"/>
    <path d="M662 92H670V236H662"/>
  </g>
  <text x="590" y="117" font-weight="600" fill="#141413">A</text>
  <text x="634" y="143" font-weight="600" fill="#141413">B</text>
  <text x="678" y="169" font-weight="600" fill="#141413">C</text>
  <text x="736" y="274" text-anchor="end" font-size="11.5" fill="#52514e">A = 화면만 (PoC) · B = 프록시·BFF까지 · C = 제한 없음 (B·C는 추후)</text>
  <g id="connectors" fill="none" stroke="#c3c2b7" stroke-width="1.25">
    <path d="M300 252V296" marker-end="url(#fe-arrow)"/>
  </g>
  <text x="308" y="280" font-size="11.5" fill="#52514e">HTTP</text>
  <g id="be">
    <rect x="40" y="296" width="520" height="56" rx="8" fill="#2a78d6" fill-opacity="0.1" stroke="#2a78d6" stroke-width="1.75"/>
    <text x="300" y="320" text-anchor="middle" font-weight="600" fill="#141413">BE (Python) · A · B · C 공통</text>
    <text x="300" y="338" text-anchor="middle" font-size="11.5" fill="#52514e">API · 업무 로직 · LLM 호출 · API 키</text>
  </g>
</svg>
