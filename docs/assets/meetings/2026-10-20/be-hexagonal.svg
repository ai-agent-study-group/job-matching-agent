<!-- 색: 파랑 #2a78d6 = 확정 · 주황 #fab219 = 미정 · 주황 점선(stroke-dasharray) = 추후 · 회색 #c3c2b7 = 선·외부 · 배경 #ededec -->
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="716" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" viewBox="0 0 760 716" role="img" aria-label="바깥(사이트 · agent · DB)은 어댑터로 갈아 끼우고, 앱은 포트만 부름" font-size="11.5">
  <rect width="100%" height="100%" rx="8" fill="#ffffff"/>
