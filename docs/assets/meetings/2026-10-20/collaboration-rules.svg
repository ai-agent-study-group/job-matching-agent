<!-- 색: 파랑 #2a78d6 = 확정 · 주황 #fab219 = 미정 · 주황 점선(stroke-dasharray) = 추후 · 회색 #c3c2b7 = 선·외부 · 배경 #ededec -->
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="408" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" viewBox="0 0 760 408" role="img" aria-label="기존 PR 흐름은 그대로, ①~④를 새로 정함" font-size="13">
  <rect width="100%" height="100%" rx="8" fill="#ffffff"/>
  <defs>
    <marker id="rules-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#c3c2b7"/>
    </marker>
  </defs>
  <text x="24" y="32" font-size="15" font-weight="600" fill="#141413">기존 PR 흐름(파랑)은 그대로, ①~④를 새로 정함</text>
  <g id="legend">
    <rect x="24" y="44" width="16" height="12" rx="3" fill="#2a78d6" fill-opacity="0.1" stroke="#2a78d6" stroke-width="1.5"/>
    <text x="48" y="54" font-size="11.5" fill="#52514e">확정 (CONTRIBUTING)</text>
    <rect x="188" y="44" width="16" height="12" rx="3" fill="#fab219" fill-opacity="0.1" stroke="#fab219" stroke-width="1.5"/>
    <text x="212" y="54" font-size="11.5" fill="#52514e">미정 (회의에서 정함)</text>
  </g>
  <g id="lane-feature">
    <rect x="24" y="72" width="712" height="168" rx="8" fill="#ededec" stroke="none"/>
    <text x="40" y="94" font-weight="600" fill="#141413">기능 코드 · CONTRIBUTING에 있음</text>
  </g>
  <g id="lane-poc">
    <rect x="24" y="256" width="712" height="128" rx="8" fill="#ededec" stroke="none"/>
    <text x="40" y="278" font-weight="600" fill="#141413">PoC · 데모 · ① 어디에 둘지 정함</text>
  </g>
  <g id="connectors" fill="none" stroke="#c3c2b7" stroke-width="1.25">
    <path d="M192 136H216" marker-end="url(#rules-arrow)"/>
    <path d="M368 136H392" marker-end="url(#rules-arrow)"/>
    <path d="M544 136H568" marker-end="url(#rules-arrow)"/>
    <path d="M192 322H256" marker-end="url(#rules-arrow)"/>
    <path d="M116 348V364H608V348" marker-end="url(#rules-arrow)"/>
  </g>
  <g id="chip-links" fill="none" stroke="#fab219" stroke-width="1.25">
    <path d="M116 162V178"/>
    <path d="M292 162V178"/>
    <path d="M468 162V178"/>
    <path d="M644 162V178"/>
  </g>
  <g id="step-branch">
    <rect x="40" y="110" width="152" height="52" rx="8" fill="#2a78d6" fill-opacity="0.1" stroke="#2a78d6" stroke-width="1.75"/>
    <text x="116" y="132" text-anchor="middle" font-weight="600" fill="#141413">작업 브랜치</text>
    <text x="116" y="150" text-anchor="middle" font-size="11.5" fill="#52514e">feat/… · fix/…</text>
  </g>
  <g id="step-pr">
    <rect x="216" y="110" width="152" height="52" rx="8" fill="#2a78d6" fill-opacity="0.1" stroke="#2a78d6" stroke-width="1.75"/>
    <text x="292" y="132" text-anchor="middle" font-weight="600" fill="#141413">PR</text>
    <text x="292" y="150" text-anchor="middle" font-size="11.5" fill="#52514e">템플릿 · 400줄 권장</text>
  </g>
  <g id="step-review">
    <rect x="392" y="110" width="152" height="52" rx="8" fill="#2a78d6" fill-opacity="0.1" stroke="#2a78d6" stroke-width="1.75"/>
    <text x="468" y="132" text-anchor="middle" font-weight="600" fill="#141413">리뷰 + CI</text>
    <text x="468" y="150" text-anchor="middle" font-size="11.5" fill="#52514e">승인 1명 · CI 통과</text>
  </g>
  <g id="step-main">
    <rect x="568" y="110" width="152" height="52" rx="8" fill="#2a78d6" fill-opacity="0.1" stroke="#2a78d6" stroke-width="1.75"/>
    <text x="644" y="132" text-anchor="middle" font-weight="600" fill="#141413">main</text>
    <text x="644" y="150" text-anchor="middle" font-size="11.5" fill="#52514e">merge commit만</text>
  </g>
  <g id="rule-data">
    <rect x="40" y="178" width="152" height="44" rx="8" fill="#fab219" fill-opacity="0.1" stroke="#fab219" stroke-width="1.75"/>
    <text x="116" y="196" text-anchor="middle" font-size="12.5" font-weight="600" fill="#141413">② 커밋 금지 대상</text>
    <text x="116" y="212" text-anchor="middle" font-size="11.5" fill="#52514e">이력서 · 키 · 실행 결과</text>
  </g>
  <g id="rule-checklist">
    <rect x="216" y="178" width="152" height="44" rx="8" fill="#fab219" fill-opacity="0.1" stroke="#fab219" stroke-width="1.75"/>
    <text x="292" y="196" text-anchor="middle" font-size="12.5" font-weight="600" fill="#141413">③ 체크리스트 확인</text>
    <text x="292" y="212" text-anchor="middle" font-size="11.5" fill="#52514e">리뷰어가 볼지</text>
  </g>
  <g id="rule-ci">
    <rect x="392" y="178" width="152" height="44" rx="8" fill="#fab219" fill-opacity="0.1" stroke="#fab219" stroke-width="1.75"/>
    <text x="468" y="196" text-anchor="middle" font-size="12.5" font-weight="600" fill="#141413">③ CI 검사 범위</text>
    <text x="468" y="212" text-anchor="middle" font-size="11.5" fill="#52514e">web/ 포함 여부</text>
  </g>
  <g id="rule-docs">
    <rect x="568" y="178" width="152" height="44" rx="8" fill="#fab219" fill-opacity="0.1" stroke="#fab219" stroke-width="1.75"/>
    <text x="644" y="196" text-anchor="middle" font-size="12.5" font-weight="600" fill="#141413">④ 문서·회의록 위치</text>
    <text x="644" y="212" text-anchor="middle" font-size="11.5" fill="#52514e">docs/ 또는 외부 문서</text>
  </g>
  <g id="poc-branch">
    <rect x="40" y="296" width="152" height="52" rx="8" fill="#2a78d6" fill-opacity="0.1" stroke="#2a78d6" stroke-width="1.75"/>
    <text x="116" y="318" text-anchor="middle" font-weight="600" fill="#141413">개인 브랜치</text>
    <text x="116" y="336" text-anchor="middle" font-size="11.5" fill="#52514e">PoC · 데모 코드</text>
  </g>
  <g id="poc-option-a">
    <rect x="256" y="296" width="224" height="52" rx="8" fill="#fab219" fill-opacity="0.1" stroke="#fab219" stroke-width="1.75"/>
    <text x="368" y="318" text-anchor="middle" font-weight="600" fill="#141413">A. 링크로만 공유</text>
    <text x="368" y="336" text-anchor="middle" font-size="11.5" fill="#52514e">main에 넣지 않음</text>
  </g>
  <g id="poc-option-b">
    <rect x="496" y="296" width="224" height="52" rx="8" fill="#fab219" fill-opacity="0.1" stroke="#fab219" stroke-width="1.75"/>
    <text x="608" y="318" text-anchor="middle" font-weight="600" fill="#141413">B. poc/ 폴더로 PR</text>
    <text x="608" y="336" text-anchor="middle" font-size="11.5" fill="#52514e">기능 코드와 같은 규칙으로 병합</text>
  </g>
</svg>
