<!-- 색: 파랑 #2a78d6 = 확정 · 주황 #fab219 = 미정 · 주황 점선(stroke-dasharray) = 추후 · 회색 #c3c2b7 = 선·외부 · 배경 #ededec -->
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" viewBox="0 0 760 360" role="img" aria-label="어느 쪽이든 같은 run_matching()이 공고별 agent를 병렬로 돌림" font-size="13">
  <rect width="100%" height="100%" rx="8" fill="#ffffff"/>
  <defs>
    <marker id="run-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#c3c2b7"/>
    </marker>
  </defs>
  <text x="24" y="32" font-size="15" font-weight="600" fill="#141413">처음부터 비동기, 같은 run_matching()이 공고별 agent를 병렬로 돌림</text>
  <g id="panel-poc">
    <rect x="24" y="48" width="344" height="296" rx="8" fill="none" stroke="#e6e6e6" stroke-width="1.25"/>
    <text x="40" y="70" font-weight="600" fill="#141413">PoC: API 안에서 비동기 (B안 · 미정)</text>
  </g>
  <g id="panel-later">
    <rect x="392" y="48" width="344" height="296" rx="8" fill="none" stroke="#e6e6e6" stroke-width="1.25"/>
    <text x="408" y="70" font-weight="600" fill="#141413">추후: worker + Redis 큐 (점선)</text>
  </g>
  <g id="connectors" fill="none" stroke="#c3c2b7" stroke-width="1.25">
    <path d="M196 120V140" marker-end="url(#run-arrow)"/>
    <path d="M196 180V200" marker-end="url(#run-arrow)"/>
    <path d="M196 240V252H110V264" marker-end="url(#run-arrow)"/>
    <path d="M196 252V264" marker-end="url(#run-arrow)"/>
    <path d="M196 252H282V264" marker-end="url(#run-arrow)"/>
    <path d="M538 100H590" marker-end="url(#run-arrow)"/>
    <path d="M650 120V140" stroke-dasharray="5 4" marker-end="url(#run-arrow)"/>
    <path d="M590 160H538" stroke-dasharray="5 4" marker-end="url(#run-arrow)"/>
    <path d="M478 180V200" stroke-dasharray="5 4" marker-end="url(#run-arrow)"/>
    <path d="M564 240V252H478V264" marker-end="url(#run-arrow)"/>
    <path d="M564 252V264" marker-end="url(#run-arrow)"/>
    <path d="M564 252H650V264" marker-end="url(#run-arrow)"/>
  </g>
  <text x="204" y="194" font-size="11.5" fill="#52514e">백그라운드 실행</text>
  <text x="658" y="134" font-size="11.5" fill="#52514e">작업 1건</text>
  <g id="poc-fe">
    <rect x="136" y="80" width="120" height="40" rx="8" fill="#2a78d6" fill-opacity="0.1" stroke="#2a78d6" stroke-width="1.75"/>
    <text x="196" y="104" text-anchor="middle" fill="#141413">FE</text>
  </g>
  <g id="poc-api">
    <rect x="136" y="140" width="120" height="40" rx="8" fill="#2a78d6" fill-opacity="0.1" stroke="#2a78d6" stroke-width="1.75"/>
    <text x="196" y="164" text-anchor="middle" fill="#141413">API</text>
  </g>
  <g id="poc-core">
    <rect x="96" y="200" width="200" height="40" rx="8" fill="#2a78d6" fill-opacity="0.24" stroke="#2a78d6" stroke-width="2"/>
    <text x="196" y="224" text-anchor="middle" font-weight="600" fill="#141413">run_matching()</text>
  </g>
  <g id="poc-agents">
    <rect x="72" y="264" width="76" height="40" rx="8" fill="#2a78d6" fill-opacity="0.1" stroke="#2a78d6" stroke-width="1.75"/>
    <rect x="158" y="264" width="76" height="40" rx="8" fill="#2a78d6" fill-opacity="0.1" stroke="#2a78d6" stroke-width="1.75"/>
    <rect x="244" y="264" width="76" height="40" rx="8" fill="#2a78d6" fill-opacity="0.1" stroke="#2a78d6" stroke-width="1.75"/>
