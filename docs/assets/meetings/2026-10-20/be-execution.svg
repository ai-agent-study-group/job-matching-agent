    <text x="650" y="164" text-anchor="middle" fill="#141413">Redis 큐</text>
  </g>
  <g id="later-worker">
    <rect x="418" y="140" width="120" height="40" rx="8" fill="#fab219" fill-opacity="0.04" stroke="#fab219" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="478" y="164" text-anchor="middle" fill="#141413">worker</text>
  </g>
  <g id="later-core">
    <rect x="464" y="200" width="200" height="40" rx="8" fill="#2a78d6" fill-opacity="0.24" stroke="#2a78d6" stroke-width="2"/>
    <text x="564" y="224" text-anchor="middle" font-weight="600" fill="#141413">run_matching()</text>
  </g>
  <g id="later-agents">
    <rect x="440" y="264" width="76" height="40" rx="8" fill="#2a78d6" fill-opacity="0.1" stroke="#2a78d6" stroke-width="1.75"/>
    <rect x="526" y="264" width="76" height="40" rx="8" fill="#2a78d6" fill-opacity="0.1" stroke="#2a78d6" stroke-width="1.75"/>
    <rect x="612" y="264" width="76" height="40" rx="8" fill="#2a78d6" fill-opacity="0.1" stroke="#2a78d6" stroke-width="1.75"/>
    <text x="478" y="288" text-anchor="middle" fill="#141413">공고 1</text>
    <text x="564" y="288" text-anchor="middle" fill="#141413">공고 2</text>
    <text x="650" y="288" text-anchor="middle" fill="#141413">공고 N</text>
  </g>
  <text x="564" y="328" text-anchor="middle" font-size="11.5" fill="#52514e">FE는 작업 ID로 결과를 조회</text>
</svg>
