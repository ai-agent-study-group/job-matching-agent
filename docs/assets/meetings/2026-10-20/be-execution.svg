    <text x="196" y="288" text-anchor="middle" fill="#141413">공고 2</text>
    <text x="282" y="288" text-anchor="middle" fill="#141413">공고 N</text>
  </g>
  <text x="196" y="320" text-anchor="middle" font-size="11.5" fill="#52514e"><tspan x="196">API가 작업 ID를 먼저 돌려주고 같은 프로세스에서 실행</tspan><tspan x="196" dy="16">FE는 작업 ID로 결과를 조회</tspan></text>
  <g id="later-fe">
    <rect x="418" y="80" width="120" height="40" rx="8" fill="#2a78d6" fill-opacity="0.1" stroke="#2a78d6" stroke-width="1.75"/>
    <text x="478" y="104" text-anchor="middle" fill="#141413">FE</text>
  </g>
  <g id="later-api">
