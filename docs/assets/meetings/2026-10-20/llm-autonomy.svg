    <g id="a-filter">
      <rect x="40" y="240" width="192" height="30" rx="8" fill="#ededec" stroke="none"/>
      <text x="136" y="260" text-anchor="middle" font-size="12" fill="#141413">조건 필터</text>
    </g>
    <g id="a-match">
      <rect x="40" y="280" width="192" height="30" rx="8" fill="#fab219" fill-opacity="0.12" stroke="#fab219" stroke-width="1.75"/>
      <text x="136" y="300" text-anchor="middle" font-size="12" font-weight="600" fill="#141413">매칭 agent</text>
      <text x="224" y="300" text-anchor="end" font-size="11.5" font-weight="600" fill="#141413">×N</text>
    </g>
    <g id="a-rank">
      <rect x="40" y="320" width="192" height="30" rx="8" fill="#ededec" stroke="none"/>
      <text x="136" y="340" text-anchor="middle" font-size="12" fill="#141413">점수 · 정렬</text>
