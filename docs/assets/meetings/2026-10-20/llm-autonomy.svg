    </g>
    <text x="40" y="410" font-size="11.5" fill="#52514e">포트: 역할 단위 (agent마다) · LLM-1 구성</text>
  </g>
  <g id="option-b">
    <rect x="268" y="64" width="224" height="358" rx="8" fill="none" stroke="#2a78d6" stroke-width="2"/>
    <rect x="402" y="74" width="78" height="20" rx="10" fill="#2a78d6" fill-opacity="0.15" stroke="#2a78d6" stroke-width="1.25"/>
    <text x="441" y="88" text-anchor="middle" font-size="11" font-weight="700" fill="#141413">현재 PoC</text>
