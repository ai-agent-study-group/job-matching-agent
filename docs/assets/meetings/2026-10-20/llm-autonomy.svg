    <text x="284" y="106" font-size="11.5" fill="#52514e">코드는 단계만 나눔</text>
    <g id="b-profile">
      <rect x="284" y="120" width="192" height="48" rx="8" fill="#fab219" fill-opacity="0.12" stroke="#fab219" stroke-width="1.75"/>
      <text x="380" y="140" text-anchor="middle" font-weight="600" fill="#141413">프로필 agent</text>
      <text x="380" y="157" text-anchor="middle" font-size="11.5" fill="#52514e">이력서에서 직무·근무지 파악</text>
    </g>
    <g id="b-search">
      <rect x="284" y="192" width="192" height="48" rx="8" fill="#fab219" fill-opacity="0.12" stroke="#fab219" stroke-width="1.75"/>
      <text x="380" y="212" text-anchor="middle" font-weight="600" fill="#141413">검색 agent</text>
      <text x="380" y="229" text-anchor="middle" font-size="11.5" fill="#52514e">도구로 출처·조건을 골라 검색</text>
    </g>
    <g id="b-match">
      <rect x="284" y="264" width="192" height="48" rx="8" fill="#fab219" fill-opacity="0.12" stroke="#fab219" stroke-width="1.75"/>
      <text x="380" y="284" text-anchor="middle" font-weight="600" fill="#141413">매칭 agent</text>
      <text x="380" y="301" text-anchor="middle" font-size="11.5" fill="#52514e">도구로 공고를 읽고 점수</text>
    </g>
    <g id="b-tool">
      <rect x="300" y="362" width="160" height="24" rx="8" fill="none" stroke="#c3c2b7" stroke-width="1.25"/>
      <text x="380" y="378" text-anchor="middle" font-size="11.5" fill="#141413">도구: MCP 서버 (LLM-4)</text>
    </g>
    <text x="284" y="410" font-size="11.5" fill="#52514e">포트: 역할 단위</text>
  </g>
  <g id="option-c">
    <rect x="512" y="64" width="224" height="358" rx="8" fill="none" stroke="#e6e6e6" stroke-width="1.25"/>
    <text x="528" y="88" font-weight="600" fill="#141413">C. agent 하나</text>
    <text x="528" y="106" font-size="11.5" fill="#52514e">agent가 순서까지 정함</text>
    <g id="c-agent">
      <rect x="528" y="120" width="192" height="230" rx="8" fill="#fab219" fill-opacity="0.12" stroke="#fab219" stroke-width="1.75"/>
      <text x="624" y="146" text-anchor="middle" font-weight="600" fill="#141413">agent 하나</text>
      <text x="624" y="182" text-anchor="middle" font-size="11.5" fill="#141413">이력서 파악</text>
      <text x="624" y="208" text-anchor="middle" font-size="11.5" fill="#141413">검색 조건 결정</text>
      <text x="624" y="234" text-anchor="middle" font-size="11.5" fill="#141413">공고 읽기·거르기</text>
      <text x="624" y="260" text-anchor="middle" font-size="11.5" fill="#141413">점수 매기기</text>
      <text x="624" y="330" text-anchor="middle" font-size="11.5" fill="#52514e">순서도 agent가 정함</text>
    </g>
    <g id="c-tool">
      <rect x="544" y="362" width="160" height="24" rx="8" fill="none" stroke="#c3c2b7" stroke-width="1.25"/>
      <text x="624" y="378" text-anchor="middle" font-size="11.5" fill="#141413">도구: MCP 서버 (LLM-4)</text>
    </g>
    <text x="528" y="410" font-size="11.5" fill="#52514e">포트: 일 단위 · match() 하나</text>
  </g>
  <text x="24" y="448" font-size="11.5" fill="#52514e">각 포트는 pydantic-ai 어댑터로 구현함 (LLM-3)</text>
</svg>
