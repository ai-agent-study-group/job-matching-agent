    <text x="268" y="54" font-size="11.5" fill="#52514e">추후</text>
    <rect x="316" y="44" width="16" height="12" rx="3" fill="none" stroke="#c3c2b7" stroke-width="1.25"/>
    <text x="340" y="54" font-size="11.5" fill="#52514e">도구</text>
    <rect x="388" y="44" width="16" height="12" rx="3" fill="none" stroke="#2a78d6" stroke-width="2"/>
    <text x="412" y="54" font-size="11.5" fill="#52514e">현재 PoC</text>
  </g>
  <g id="connectors" fill="none" stroke="#c3c2b7" stroke-width="1.25">
    <path d="M136 150V158" marker-end="url(#auto-arrow)"/>
    <path d="M136 190V198" marker-end="url(#auto-arrow)"/>
    <path d="M136 230V238" marker-end="url(#auto-arrow)"/>
    <path d="M136 270V278" marker-end="url(#auto-arrow)"/>
    <path d="M136 310V318" marker-end="url(#auto-arrow)"/>
    <path d="M380 168V190" marker-end="url(#auto-arrow)"/>
    <path d="M380 240V262" marker-end="url(#auto-arrow)"/>
    <path d="M380 312V360" marker-end="url(#auto-arrow)"/>
    <path d="M476 216H486V374H462" marker-end="url(#auto-arrow)"/>
    <path d="M624 350V360" marker-end="url(#auto-arrow)"/>
  </g>
  <g id="option-a">
    <rect x="24" y="64" width="224" height="358" rx="8" fill="none" stroke="#e6e6e6" stroke-width="1.25"/>
    <text x="40" y="88" font-weight="600" fill="#141413">A. 워크플로</text>
    <text x="40" y="106" font-size="11.5" fill="#52514e">코드가 순서·검색·거르기를 정함</text>
    <g id="a-profile">
      <rect x="40" y="120" width="192" height="30" rx="8" fill="#fab219" fill-opacity="0.12" stroke="#fab219" stroke-width="1.75"/>
      <text x="136" y="140" text-anchor="middle" font-size="12" font-weight="600" fill="#141413">프로필 agent</text>
    </g>
    <g id="a-search">
