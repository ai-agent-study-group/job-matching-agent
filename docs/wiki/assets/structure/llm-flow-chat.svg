<!-- 색: 파랑 #2a78d6 = 확정 · 주황 #fab219 = 미정 · 주황 점선(stroke-dasharray) = 추후 · 회색 #c3c2b7 = 선·외부 · 배경 #ededec -->
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="648" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" viewBox="0 0 760 648" role="img" aria-label="2. 대화형 앱: 전체를 맡은 대화 agent가 단계마다 진행할지, 사용자에게 물을지 정함" font-size="13">
  <rect width="100%" height="100%" rx="8" fill="#ffffff"/>
  <defs>
    <marker id="orc-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#c3c2b7"/>
    </marker>
  </defs>
  <text x="24" y="32" font-size="15" font-weight="600" fill="#141413">2. 대화형 앱: 전체를 맡은 대화 agent가 단계마다 진행할지, 사용자에게 물을지 정함</text>
  <g id="legend">
    <rect x="24" y="46" width="16" height="12" rx="3" fill="#fab219" fill-opacity="0.12" stroke="#fab219" stroke-width="1.5"/>
    <text x="48" y="56" font-size="11.5" fill="#52514e">LLM 단계 (agent)</text>
    <rect x="160" y="46" width="16" height="12" rx="3" fill="#2a78d6" fill-opacity="0.1" stroke="#2a78d6" stroke-width="1.5"/>
    <text x="184" y="56" font-size="11.5" fill="#52514e">MCP 도구</text>
    <rect x="264" y="46" width="16" height="12" rx="3" fill="#ededec" stroke="none"/>
    <text x="288" y="56" font-size="11.5" fill="#52514e">코드</text>
    <rect x="336" y="46" width="16" height="12" rx="3" fill="none" stroke="#c3c2b7" stroke-width="1.25"/>
    <text x="360" y="56" font-size="11.5" fill="#52514e">데이터 · 화면</text>
    <rect x="456" y="46" width="16" height="12" rx="3" fill="none" stroke="#fab219" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="480" y="56" font-size="11.5" fill="#52514e">추후</text>
  </g>
  <g id="connectors" fill="none" stroke="#c3c2b7" stroke-width="1.25">
    <path d="M104 134V148" marker-end="url(#orc-arrow)"/>
    <path d="M120 150V136" marker-end="url(#orc-arrow)"/>
    <path d="M200 154H246" marker-end="url(#orc-arrow)"/>
    <path d="M200 206H246" marker-end="url(#orc-arrow)"/>
    <path d="M200 260H294" marker-end="url(#orc-arrow)"/>
    <path d="M200 312H294" marker-end="url(#orc-arrow)"/>
    <path d="M200 364H246" marker-end="url(#orc-arrow)"/>
    <path d="M200 420H246" marker-end="url(#orc-arrow)"/>
    <path d="M200 476H246" marker-end="url(#orc-arrow)"/>
    <path d="M200 550H246" marker-end="url(#orc-arrow)"/>
    <path d="M112 576V590" marker-end="url(#orc-arrow)"/>
    <path d="M520 286H560" marker-end="url(#orc-arrow)"/>
    <path d="M512 420H560" marker-end="url(#orc-arrow)"/>
    <path d="M512 476H560" stroke-dasharray="5 4" marker-end="url(#orc-arrow)"/>
  </g>
  <text x="224" y="198" text-anchor="middle" font-size="11" fill="#52514e">매 턴</text>
  <text x="224" y="146" text-anchor="middle" font-size="11" fill="#52514e">부름</text>
  <text x="540" y="278" text-anchor="middle" font-size="11.5" fill="#52514e">호출</text>
  <text x="24" y="86" font-size="11.5" font-weight="600" fill="#52514e">JMA 앱 (채팅)에서</text>
  <text x="380" y="126" text-anchor="middle" font-size="11" fill="#52514e">보통 순서 · agent가 건너뛰거나 다시 부름</text>
  <g id="user">
    <rect x="24" y="94" width="176" height="40" rx="8" fill="none" stroke="#c3c2b7" stroke-width="1.25"/>
    <text x="112" y="111" text-anchor="middle" font-weight="600" fill="#141413">사용자 (채팅)</text>
    <text x="112" y="127" text-anchor="middle" font-size="11.5" fill="#52514e">이력서 올리고 묻고 답함</text>
  </g>
  <g id="orchestrator">
    <rect x="24" y="150" width="176" height="426" rx="8" fill="#fab219" fill-opacity="0.12" stroke="#fab219" stroke-width="1.75" stroke-dasharray="5 4"/>
    <text x="112" y="176" text-anchor="middle" font-weight="600" fill="#141413">대화 agent (추후)</text>
    <text x="112" y="194" text-anchor="middle" font-size="11.5" fill="#52514e">전체를 맡아 단계마다 판단</text>
    <text x="112" y="240" text-anchor="middle" font-size="12" fill="#141413">다음 단계로 갈까?</text>
    <text x="112" y="268" text-anchor="middle" font-size="12" fill="#141413">사용자에게 물어볼까?</text>
    <text x="112" y="296" text-anchor="middle" font-size="12" fill="#141413">조건 바꿔 다시 할까?</text>
    <text x="112" y="324" text-anchor="middle" font-size="12" fill="#141413">결과를 어떻게 답할까?</text>
    <text x="112" y="380" text-anchor="middle" font-size="11" fill="#52514e">예: 이력서 2년 ↔ 대화 3년이면 확인</text>
    <text x="112" y="398" text-anchor="middle" font-size="11" fill="#52514e">0건이면 원격도 되는지 물음</text>
    <text x="112" y="416" text-anchor="middle" font-size="11" fill="#52514e">300건이면 범위를 좁힐지 물음</text>
    <text x="112" y="540" text-anchor="middle" font-size="11" fill="#52514e">제한: 최대 단계 수 ·</text>
    <text x="112" y="556" text-anchor="middle" font-size="11" fill="#52514e">꼭 거칠 단계</text>
  </g>
  <g id="step-text">
    <rect x="248" y="136" width="264" height="36" rx="8" fill="#ededec" stroke="none"/>
    <text x="380" y="159" text-anchor="middle" font-size="12.5" fill="#141413">이력서 → 텍스트</text>
  </g>
  <g id="step-profile">
    <rect x="248" y="184" width="264" height="44" rx="8" fill="#fab219" fill-opacity="0.12" stroke="#fab219" stroke-width="1.75"/>
    <text x="380" y="203" text-anchor="middle" font-weight="600" fill="#141413">프로필 agent (이력서 · 대화)</text>
    <text x="380" y="220" text-anchor="middle" font-size="11.5" fill="#52514e">반영할 것 · 물어볼 것을 나눠 돌려줌</text>
  </g>
  <g id="mcp-box">
    <rect x="240" y="234" width="280" height="104" rx="10" fill="#8b5cf6" fill-opacity="0.06" stroke="#8b5cf6" stroke-width="1.25"/>
    <text x="268" y="284" text-anchor="middle" font-size="11.5" font-weight="600" fill="#141413">MCP</text>
    <text x="268" y="300" text-anchor="middle" font-size="11.5" font-weight="600" fill="#141413">서버</text>
  </g>
  <g id="step-search">
    <rect x="296" y="240" width="168" height="40" rx="8" fill="#2a78d6" fill-opacity="0.1" stroke="#2a78d6" stroke-width="1.75"/>
    <text x="380" y="257" text-anchor="middle" font-weight="600" fill="#141413">search_jobs</text>
    <text x="380" y="273" text-anchor="middle" font-size="11.5" fill="#52514e">검색 · 조건 필터</text>
  </g>
  <g id="step-get">
    <rect x="296" y="292" width="168" height="40" rx="8" fill="#2a78d6" fill-opacity="0.1" stroke="#2a78d6" stroke-width="1.75"/>
    <text x="380" y="309" text-anchor="middle" font-weight="600" fill="#141413">get_job</text>
    <text x="380" y="325" text-anchor="middle" font-size="11.5" fill="#52514e">공고 본문 가져오기</text>
  </g>
  <g id="step-filter">
    <rect x="248" y="344" width="264" height="40" rx="8" fill="#ededec" stroke="none"/>
    <text x="380" y="361" text-anchor="middle" font-weight="600" fill="#141413">조건 필터</text>
    <text x="380" y="377" text-anchor="middle" font-size="11.5" fill="#52514e">저장된 JD · 출처 정보로 거름</text>
  </g>
  <g id="mcp-later">
    <rect x="240" y="392" width="280" height="130" rx="10" fill="#8b5cf6" fill-opacity="0.03" stroke="#8b5cf6" stroke-width="1.25" stroke-dasharray="5 4"/>
    <text x="512" y="515" text-anchor="end" font-size="11" font-weight="600" fill="#8b5cf6">추후 MCP 도구 후보</text>
  </g>
  <g id="step-structure">
    <rect x="248" y="398" width="264" height="44" rx="8" fill="#fab219" fill-opacity="0.12" stroke="#fab219" stroke-width="1.75"/>
    <text x="380" y="417" text-anchor="middle" font-weight="600" fill="#141413">공고 정리 agent</text>
    <text x="380" y="434" text-anchor="middle" font-size="11.5" fill="#52514e">요건 · 언어 · 연차 추출 · 공고마다</text>
    <text x="500" y="425" text-anchor="end" font-weight="600" fill="#141413">×N</text>
  </g>
  <g id="step-match">
    <rect x="248" y="454" width="264" height="44" rx="8" fill="#fab219" fill-opacity="0.12" stroke="#fab219" stroke-width="1.75"/>
    <text x="380" y="473" text-anchor="middle" font-weight="600" fill="#141413">매칭 agent</text>
    <text x="380" y="490" text-anchor="middle" font-size="11.5" fill="#52514e">요건별 충족 판정 · 근거 · 공고마다</text>
    <text x="500" y="481" text-anchor="end" font-weight="600" fill="#141413">×N</text>
  </g>
  <g id="step-rank">
    <rect x="248" y="530" width="264" height="40" rx="8" fill="#ededec" stroke="none"/>
    <text x="380" y="547" text-anchor="middle" font-weight="600" fill="#141413">점수 · 정렬 · 상위 N개</text>
    <text x="380" y="563" text-anchor="middle" font-size="11.5" fill="#52514e">점수: 규칙 합산 또는 LLM (BE-3)</text>
  </g>
  <g id="sites">
    <rect x="560" y="254" width="176" height="64" rx="8" fill="none" stroke="#c3c2b7" stroke-width="1.25"/>
    <text x="648" y="280" text-anchor="middle" font-weight="600" fill="#141413">공고 사이트</text>
    <text x="648" y="298" text-anchor="middle" font-size="11.5" fill="#52514e">Greenhouse · 연방고용청 API</text>
  </g>
  <g id="profile-store">
    <path d="M512 206H558" fill="none" stroke="#c3c2b7" stroke-width="1.25" stroke-dasharray="5 4" marker-end="url(#orc-arrow)"/>
    <text x="536" y="198" text-anchor="middle" font-size="11.5" fill="#52514e">갱신</text>
    <rect x="560" y="164" width="176" height="64" rx="8" fill="none" stroke="#fab219" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="648" y="184" text-anchor="middle" font-weight="600" fill="#141413">프로필 저장 (추후)</text>
    <text x="648" y="201" text-anchor="middle" font-size="11.5" fill="#52514e">대화로 경력 · 선호 갱신</text>
    <text x="648" y="218" text-anchor="middle" font-size="11" fill="#52514e"/>
  </g>
  <g id="cache">
    <rect x="560" y="398" width="176" height="44" rx="8" fill="#ededec" stroke="none"/>
    <text x="648" y="417" text-anchor="middle" font-weight="600" fill="#141413">정리 결과 저장</text>
    <text x="648" y="434" text-anchor="middle" font-size="11.5" fill="#52514e">다음엔 재사용</text>
  </g>
  <g id="eval">
    <rect x="560" y="454" width="176" height="44" rx="8" fill="none" stroke="#fab219" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="648" y="473" text-anchor="middle" font-weight="600" fill="#141413">평가 셋 비교 (추후)</text>
    <text x="648" y="490" text-anchor="middle" font-size="11.5" fill="#52514e">정답 라벨과 비교</text>
  </g>
  <g id="notes">
    <text x="560" y="548" font-size="11.5" fill="#52514e">1번의 단계가 그대로</text>
    <text x="560" y="564" font-size="11.5" fill="#52514e">agent의 도구가 됨</text>
    <text x="560" y="596" font-size="11.5" fill="#52514e">순서가 매번 달라질 수 있어</text>
    <text x="560" y="612" font-size="11.5" fill="#52514e">평가는 1번보다 어려움</text>
  </g>
  <g id="out">
    <rect x="24" y="592" width="176" height="44" rx="8" fill="none" stroke="#c3c2b7" stroke-width="1.25"/>
    <text x="112" y="611" text-anchor="middle" font-weight="600" fill="#141413">FE 결과 목록</text>
    <text x="112" y="628" text-anchor="middle" font-size="11.5" fill="#52514e">대화로 설명 · 순위 · 근거</text>
  </g>
</svg>
