<!-- 색: 파랑 #2a78d6 = 확정 · 주황 #fab219 = 미정 · 주황 점선(stroke-dasharray) = 추후 · 회색 #c3c2b7 = 선·외부 · 배경 #ededec -->
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="572" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" viewBox="0 0 760 572" role="img" aria-label="MCP 서버는 커넥터와 JMA 앱의 우리 agent가 같이 부르는 도구 서버" font-size="13">
