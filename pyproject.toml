[project]
name = "job-matching-agent"
version = "0.1.0"
description = "구인 알림 공고의 JD를 수집해 내 이력과 요건 단위로 매칭도를 분석하는 에이전트"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "fastmcp>=4.1.3",
    "httpx2>=2.13.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[build-system]
requires = ["uv_build>=0.9.2,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["domain", "port", "service", "adapter"]
namespace = true  # __init__.py 없는 폴더도 패키지로 빌드

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = ["--import-mode=importlib"]  # 다른 폴더의 같은 이름 테스트 파일 허용
